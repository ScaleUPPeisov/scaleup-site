name: ENDLUME Tauri Signing Key Probe

on:
  push:
    branches:
      - release-fix/endlume-10.0.6-tauri-hosted
    paths:
      - ".github/workflows/endlume-tauri-signing-key-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      ENDLUME_SOURCE_TOKEN: ${{ secrets.ENDLUME_SOURCE_TOKEN }}
    steps:
      - name: Check required secrets without exposing them
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${ENDLUME_SOURCE_TOKEN:-}" || { echo ENDLUME_SOURCE_TOKEN_MISSING; exit 11; }
          test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || { echo TAURI_SIGNING_PRIVATE_KEY_MISSING; exit 12; }
          echo ENDLUME_HOSTED_TAURI_SIGNING_READY
