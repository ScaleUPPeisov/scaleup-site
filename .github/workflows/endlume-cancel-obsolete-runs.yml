name: ENDLUME Cancel Obsolete Private Runs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/endlume-cancel-obsolete-runs.yml"

permissions:
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN_A: ${{ secrets.ENDLUME_RELEASE_TOKEN }}
      TOKEN_B: ${{ secrets.ENDLUME_SOURCE_TOKEN }}
    steps:
      - name: Cancel obsolete ENDLUME runs
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET="ScaleUPPeisov/endlume-desktop"
          KEEP="36853216451"
          IDS="36822270902 36839613696 36839442535 36819298424 36814115561"

          try_token() {
            local token="$1"
            [[ -n "$token" ]] || return 1
            local ok=0
            for id in $IDS; do
              [[ "$id" == "$KEEP" ]] && continue
              code="$(curl -sS -o /tmp/cancel-$id.json -w '%{http_code}'                 -X POST                 -H "Authorization: Bearer $token"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "https://api.github.com/repos/$TARGET/actions/runs/$id/cancel")"
              echo "cancel $id -> HTTP $code"
              if [[ "$code" == "202" || "$code" == "409" ]]; then ok=1; fi
            done
            [[ "$ok" == 1 ]]
          }

          if try_token "$TOKEN_A"; then
            echo "OBSOLETE_ENDLUME_RUNS_CANCEL_REQUESTED_WITH_RELEASE_TOKEN"
            exit 0
          fi
          if try_token "$TOKEN_B"; then
            echo "OBSOLETE_ENDLUME_RUNS_CANCEL_REQUESTED_WITH_SOURCE_TOKEN"
            exit 0
          fi
          echo "NO_TOKEN_WITH_ACTIONS_WRITE_PERMISSION"
          exit 21
