name: ScaleUP Control check

on:
  push:
    branches: [main]
    paths:
      - 'endlume-control/**'
      - '.github/workflows/endlume-control-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract module script
        shell: python
        run: |
          from pathlib import Path
          import re
          html=Path("endlume-control/index.html").read_text(encoding="utf-8")
          m=re.search(r'<script type="module">(.*?)</script>',html,re.S)
          if not m:
              raise SystemExit("module script not found")
          Path("/tmp/endlume-control.mjs").write_text(m.group(1),encoding="utf-8")
      - name: JavaScript syntax
        run: node --check /tmp/endlume-control.mjs
      - name: Required surfaces
        shell: python
        run: |
          from pathlib import Path
          s=Path("endlume-control/index.html").read_text(encoding="utf-8")
          required=[
            "page-dashboard","page-clients","page-devices","page-renders",
            "page-versions","page-notifications","page-security",
            "page-vyron-overview","page-vyron-clients","page-vyron-devices",
            "page-vyron-channels","page-vyron-errors","page-vyron-quota","page-vyron-releases",
            "productSwitch","endlumeNav","vyronNav",
            "client_detail","rotate_key","security_mfa",
            "vyron-admin-licenses","vyronCreateBtn","vyronLicenseCmd","vyronDeviceCmd",
            "vyronHealthTable","vyronChannelsTable","vyronErrorsTable","vyronQuotaStats",
            "VYRON_2.1.9_x64-setup.exe"
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit("Missing: "+", ".join(missing))
          print("ScaleUP Control static contracts PASS: ENDLUME + VYRON")
