name: ENDLUME 10.0.6 Cloud macOS Legacy Updater Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/endlume-cloud-stable-macos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: endlume-1006-cloud-macos-legacy-updater
  cancel-in-progress: false

env:
  PRIVATE_REPO: ScaleUPPeisov/endlume-desktop
  SOURCE_SHA: bd81d86152cb2f20fe02e33849aec255ea013634
  HOTFIX_SHA: 03df61a58641d5ce0b4e1c432c99af935acbf4d1
  VERSION: 10.0.6
  PRIVATE_TAG: endlume-v10.0.6
  PUBLIC_TAG: endlume-stable
  ZIP_NAME: ENDLUME-YT-Studio-PEISOV-10.0.6-macOS-ARM64.zip
  SHA_NAME: ENDLUME-YT-Studio-PEISOV-10.0.6-macOS-ARM64.zip.sha256

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Clone exact private ENDLUME source
        env:
          SOURCE_TOKEN: ${{ secrets.ENDLUME_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${SOURCE_TOKEN:-}" || { echo "ENDLUME_SOURCE_TOKEN missing"; exit 10; }
          git clone "https://x-access-token:${SOURCE_TOKEN}@github.com/${PRIVATE_REPO}.git" endlume-src
          cd endlume-src
          git checkout "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$HOTFIX_SHA" "$SOURCE_SHA"
          echo "SOURCE_HOTFIX_INCLUDED_GREEN"

      - name: Verify version source of truth
        shell: bash
        run: |
          set -Eeuo pipefail
          cd endlume-src
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          v="10.0.6"
          assert json.loads(Path("package.json").read_text())["version"]==v
          assert json.loads(Path("package-lock.json").read_text())["version"]==v
          cfg=json.loads(Path("src-tauri/tauri.conf.json").read_text())
          assert cfg["version"]==v
          cargo=Path("src-tauri/Cargo.toml").read_text()
          assert re.search(r'^version\s*=\s*"10\.0\.6"$',cargo,re.M)
          settings=Path("src/pages/SettingsPage.tsx").read_text()
          assert "appVersion" in settings and "api.appVersion()" in settings
          print("VERSION_10_0_6_GREEN")
          PY

      - name: Setup Node and Rust
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust target
        shell: bash
        run: rustup target add aarch64-apple-darwin

      - name: Stage portable Apple Silicon FFmpeg
        shell: bash
        run: |
          set -Eeuo pipefail
          cd endlume-src
          TMP="$(mktemp -d)"
          curl -fL --retry 4 --connect-timeout 20 --max-time 300             "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip" -o "$TMP/ffmpeg.zip"
          curl -fL --retry 4 --connect-timeout 20 --max-time 300             "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip" -o "$TMP/ffprobe.zip"
          mkdir -p "$TMP/fm" "$TMP/fp" src-tauri/binaries
          ditto -x -k "$TMP/ffmpeg.zip" "$TMP/fm"
          ditto -x -k "$TMP/ffprobe.zip" "$TMP/fp"
          FFMPEG="$(find "$TMP/fm" -type f -name ffmpeg -print -quit)"
          FFPROBE="$(find "$TMP/fp" -type f -name ffprobe -print -quit)"
          chmod 755 "$FFMPEG" "$FFPROBE"
          file "$FFMPEG" | grep -E 'arm64|Mach-O'
          file "$FFPROBE" | grep -E 'arm64|Mach-O'
          FILTERS="$("$FFMPEG" -hide_banner -filters 2>&1)"
          printf '%s\n' "$FILTERS" | grep acrossfade
          for BIN in "$FFMPEG" "$FFPROBE"; do
            BAD="$(otool -L "$BIN" | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/Library/)' || true)"
            test -z "$BAD" || { echo "$BAD"; exit 24; }
          done
          cp "$FFMPEG" src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          cp "$FFPROBE" src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod 755 src-tauri/binaries/ffmpeg-aarch64-apple-darwin src-tauri/binaries/ffprobe-aarch64-apple-darwin
          echo "PORTABLE_FFMPEG_GREEN"

      - name: Build exact ENDLUME 10.0.6 app
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        shell: bash
        run: |
          set -Eeuo pipefail
          cd endlume-src
          npm ci
          npm run check
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("src-tauri/tauri.conf.json")
          d=json.loads(p.read_text())
          d["bundle"]["createUpdaterArtifacts"]=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          PY
          ENDLUME_TAURI_TARGET=aarch64-apple-darwin node scripts/prepare-macos-ffmpeg-runtime.mjs
          npx tauri build --target aarch64-apple-darwin --bundles app

      - name: Package updater-compatible application
        shell: bash
        run: |
          set -Eeuo pipefail
          cd endlume-src
          APP="$(find src-tauri/target -type d -path '*/aarch64-apple-darwin/release/bundle/macos/*.app' -print -quit)"
          test -n "$APP" && test -d "$APP"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "studio.endlume.desktop"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          file "$APP/Contents/MacOS/"* | grep arm64
          find "$APP/Contents" -type f -name 'ffmpeg*' -perm +111 | grep .
          find "$APP/Contents" -type f -name 'ffprobe*' -perm +111 | grep .

          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          OUT="$RUNNER_TEMP/release"
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$OUT" "$STAGE"
          ditto "$APP" "$STAGE/ENDLUME Studio.app"
          codesign --verify --deep --strict "$STAGE/ENDLUME Studio.app"
          ditto -c -k --sequesterRsrc --keepParent "$STAGE/ENDLUME Studio.app" "$OUT/$ZIP_NAME"
          SUM="$(shasum -a 256 "$OUT/$ZIP_NAME" | awk '{print $1}')"
          printf '%s  %s\n' "$SUM" "$ZIP_NAME" > "$OUT/$SHA_NAME"
          echo "LOCAL_SHA=$SUM" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "MAC_BUILD_GREEN"

      - name: Publish private release assets
        env:
          GH_TOKEN: ${{ secrets.ENDLUME_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh auth status -h github.com
          if ! gh release view "$PRIVATE_TAG" --repo "$PRIVATE_REPO" >/dev/null 2>&1; then
            gh release create "$PRIVATE_TAG" --repo "$PRIVATE_REPO" --target "$SOURCE_SHA"               --title "ENDLUME 10.0.6"               --notes "ENDLUME 10.0.6 production macOS in-app update. Hotfix $HOTFIX_SHA."
          fi
          gh release upload "$PRIVATE_TAG" "$OUT/$ZIP_NAME" "$OUT/$SHA_NAME" --clobber --repo "$PRIVATE_REPO"

      - name: Re-download private artifacts and verify
        env:
          GH_TOKEN: ${{ secrets.ENDLUME_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          VERIFY="$RUNNER_TEMP/verify"
          mkdir -p "$VERIFY"
          gh release download "$PRIVATE_TAG" --repo "$PRIVATE_REPO"             --pattern "$ZIP_NAME" --pattern "$SHA_NAME" --dir "$VERIFY" --clobber
          (cd "$VERIFY" && shasum -a 256 -c "$SHA_NAME")
          REMOTE_SHA="$(shasum -a 256 "$VERIFY/$ZIP_NAME" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$LOCAL_SHA"
          mkdir -p "$RUNNER_TEMP/unpack"
          ditto -x -k "$VERIFY/$ZIP_NAME" "$RUNNER_TEMP/unpack"
          APP="$RUNNER_TEMP/unpack/ENDLUME Studio.app"
          test -d "$APP"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          codesign --verify --deep --strict "$APP"
          echo "PUBLIC_REDOWNLOAD_GREEN"

      - name: Mirror direct download to public stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          HOST="$GITHUB_REPOSITORY"
          gh release view "$PUBLIC_TAG" --repo "$HOST" >/dev/null 2>&1 ||             gh release create "$PUBLIC_TAG" --repo "$HOST" --title "ENDLUME Stable Updates" --notes "ENDLUME stable update channel."
          gh release upload "$PUBLIC_TAG" "$OUT/$ZIP_NAME" "$OUT/$SHA_NAME" --clobber --repo "$HOST"

          curl -fL --retry 5             "https://github.com/$HOST/releases/download/$PUBLIC_TAG/$ZIP_NAME?run=$GITHUB_RUN_ID"             -o "$RUNNER_TEMP/public.zip"
          test "$(shasum -a 256 "$RUNNER_TEMP/public.zip" | awk '{print $1}')" = "$LOCAL_SHA"
          echo "PUBLIC_DIRECT_DOWNLOAD_GREEN"

      - name: Publish old-ENDLUME in-app updater manifest LAST
        env:
          GH_TOKEN: ${{ secrets.ENDLUME_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          MANIFEST="$RUNNER_TEMP/latest.json"
          python3 - "$MANIFEST" <<'PY'
          import json,sys
          d={
            "version":"10.0.6",
            "date":"01.10.2026",
            "channel":"remote-binary",
            "candidateRevision":6,
            "builder":"public-hosted-macos-legacy-updater",
            "ciBuilder":"public-hosted-macos-legacy-updater",
            "releaseTag":"endlume-v10.0.6",
            "asset":"ENDLUME-YT-Studio-PEISOV-10.0.6-macOS-ARM64.zip",
            "checksumAsset":"ENDLUME-YT-Studio-PEISOV-10.0.6-macOS-ARM64.zip.sha256",
            "notes":"ENDLUME 10.0.6 production: FFmpeg Operation not permitted fix, finite concat audio, Crossfade, AAC 320 kbps / 48 kHz / stereo, duration-aware validation, Effects/Subscribe Preview, Delete Effect and correct failed queue state."
          }
          json.dump(d,open(sys.argv[1],"w"),ensure_ascii=False,indent=2)
          PY

          CONTENT_PATH="updates/latest.json"
          OLD_SHA="$(gh api "/repos/$PRIVATE_REPO/contents/$CONTENT_PATH?ref=release" --jq .sha)"
          PAYLOAD="$RUNNER_TEMP/payload.json"
          python3 - "$MANIFEST" "$PAYLOAD" "$OLD_SHA" <<'PY'
          import base64,json,pathlib,sys
          src,out,sha=sys.argv[1:]
          json.dump({
            "message":"release: publish ENDLUME 10.0.6 in-app updater manifest",
            "branch":"release",
            "sha":sha,
            "content":base64.b64encode(pathlib.Path(src).read_bytes()).decode()
          },open(out,"w"))
          PY
          gh api --method PUT "/repos/$PRIVATE_REPO/contents/$CONTENT_PATH" --input "$PAYLOAD" >/dev/null
          RAW="$(gh api -H 'Accept: application/vnd.github.raw+json' "/repos/$PRIVATE_REPO/contents/$CONTENT_PATH?ref=release")"
          printf '%s' "$RAW" > "$RUNNER_TEMP/published-latest.json"
          python3 - "$RUNNER_TEMP/published-latest.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["version"]=="10.0.6"
          assert d["releaseTag"]=="endlume-v10.0.6"
          print("OLD_ENDLUME_DETECTS_10_0_6_MANIFEST_GREEN")
          PY

      - name: Final
        run: |
          echo "VERSION=10.0.6"
          echo "HOTFIX=$HOTFIX_SHA"
          echo "SOURCE=$SOURCE_SHA"
          echo "MAC=GREEN"
          echo "IN_APP_MANIFEST=10.0.6"
